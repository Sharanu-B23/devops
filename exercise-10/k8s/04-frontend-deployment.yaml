apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-order-deployment
  labels:
    app: frontend-order
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-order
  template:
    metadata:
      labels:
        app: frontend-order
        tier: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - frontend-order
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: order-web
          image: ex10-order:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: CATALOG_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
